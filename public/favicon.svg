<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <defs>
    <linearGradient id="oro" x1="16" y1="10" x2="82" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FBF0D2"/><stop offset="0.22" stop-color="#F0D89C"/>
      <stop offset="0.5" stop-color="#E4C480"/><stop offset="0.74" stop-color="#B98F3E"/>
      <stop offset="1" stop-color="#8C6520"/>
    </linearGradient>
    <linearGradient id="oroClaro" x1="30" y1="34" x2="70" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF8E4"/><stop offset="0.55" stop-color="#EFD79C"/>
      <stop offset="1" stop-color="#C79E4E"/>
