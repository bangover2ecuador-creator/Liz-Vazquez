  <path d="M22 60.5 47.5 35a3 3 0 0 1 2.1-.9h20.6a2.4 2.4 0 0 1 2.4 2.4v3.1H49.8a3 3 0 0 0-2.1.9L24.4 63.6H24.1a2.1 2.1 0 0 1-2.1-2.1Z" fill="url(#oroClaro)"/>
  <path d="M22 60.5 47.5 35a3 3 0 0 1 2.1-.9h20.6a2.4 2.4 0 0 1 2.4 2.4v1.2H49.9a3 3 0 0 0-2.1.9L23.4 62.9Z" fill="url(#brillo)"/>

  <!-- Agujeros, con sombra interior para que se lean como huecos -->
  <g>
    <circle cx="36.5" cy="55" r="3.6" fill="#0B0709"/>
    <circle cx="36.5" cy="54.3" r="3.6" fill="#4A2029" opacity="0.55"/>
    <circle cx="52" cy="47.5" r="2.8" fill="#0B0709"/>
    <circle cx="52" cy="46.9" r="2.8" fill="#4A2029" opacity="0.5"/>
    <circle cx="61.5" cy="56" r="2.1" fill="#0B0709"/>
    <circle cx="61.5" cy="55.5" r="2.1" fill="#4A2029" opacity="0.5"/>
  </g>

  <!-- Destellos de distinto peso, como su ✨ -->
  <path d="M42 30.5c.15 2.1.9 3.5 2.1 4.2-1.2.7-1.95 2.1-2.1 4.2-.15-2.1-.9-3.5-2.1-4.2 1.2-.7 1.95-2.1 2.1-4.2Z" fill="url(#oroClaro)"/>
  <path d="M56.5 24c.1 1.5.65 2.5 1.5 3-.85.5-1.4 1.5-1.5 3-.1-1.5-.65-2.5-1.5-3 .85-.5 1.4-1.5 1.5-3Z" fill="url(#oroClaro)" opacity="0.85"/>
  <circle cx="30" cy="40" r="1.15" fill="url(#oroClaro)" opacity="0.7"/>
