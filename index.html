  <body>
    <!-- Pantalla de carga.
         Va en el HTML, no en React: tiene que verse ANTES de que
         llegue el JavaScript, que es justo el rato que dura. main.tsx
         la retira en cuanto la app monta. -->
    <style>
      #carga {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1.25rem;
        background:
          radial-gradient(60% 45% at 50% 38%, rgba(157, 77, 255, 0.28), transparent 70%),
          #0a0518;
      }
      /* Salida: el quesito se encoge y la pantalla se abre */
      #carga.fuera {
        animation: carga-sale 0.55s cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }
      #carga.fuera svg {
        animation: queso-encoge 0.5s cubic-bezier(0.5, 0, 0.75, 0) forwards;
      }
      #carga.fuera p {
        animation: texto-sale 0.3s ease forwards;
      }
      @keyframes carga-sale {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      @keyframes queso-encoge {
        0% {
          transform: scale(1) rotate(0deg);
        }
        45% {
          transform: scale(1.12) rotate(6deg);
        }
        100% {
          transform: scale(0.12) rotate(-14deg);
          opacity: 0;
        }
      }
      @keyframes texto-sale {
        to {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      #carga svg {
        width: 148px;
        height: 148px;
        transform-origin: 50% 80%;
        animation:
          queso-entra 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both,
          saluda 1.3s ease-in-out 0.5s infinite;
      }
      @keyframes queso-entra {
        from {
          transform: scale(0.3);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      /* El queso se balancea; la manita va aparte, mas rapida */
      @keyframes saluda {
        0%, 100% { transform: rotate(-5deg) translateY(0); }
        50% { transform: rotate(5deg) translateY(-5px); }
      }
      #carga .mano {
        transform-origin: 70px 48px;
        animation: agita 0.55s ease-in-out infinite;
      }
      @keyframes agita {
        0%, 100% { transform: rotate(-16deg); }
        50% { transform: rotate(16deg); }
      }
      #carga .chispa { animation: brilla 1.4s ease-in-out infinite; }
      #carga .chispa:nth-of-type(2) { animation-delay: 0.35s; }
      @keyframes brilla {
        0%, 100% { opacity: 0.35; transform: scale(0.85); }
        50% { opacity: 1; transform: scale(1.1); }
      }
      #carga p {
        margin: 0;
        animation: texto-entra 0.5s ease 0.35s both;
        font-family: Georgia, serif;
        font-style: italic;
        font-size: 0.95rem;
        color: #e4c480;
        letter-spacing: 0.02em;
      }
      @keyframes texto-entra {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #carga svg, #carga .mano, #carga .chispa { animation: none; }
      }
    </style>

    <div id="carga">
      <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <linearGradient id="cargaOro" x1="16" y1="24" x2="80" y2="76" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FBF0D2" />
            <stop offset="0.5" stop-color="#E4C480" />
            <stop offset="1" stop-color="#B98F3E" />
          </linearGradient>
        </defs>

        <!-- Cuña de queso -->
        <path d="M14 66 44 36a3 3 0 0 1 2.1-.9h20.5a2.4 2.4 0 0 1 2.4 2.4v20.4a3 3 0 0 1-.9 2.1L62.4 71H16.1A2.1 2.1 0 0 1 14 68.9Z" fill="url(#cargaOro)" />
        <path d="M14 66 44 36a3 3 0 0 1 2.1-.9h20.5a2.4 2.4 0 0 1 2.4 2.4v2.6H46.2a3 3 0 0 0-2.1.9L16.4 69Z" fill="#FFF6E0" opacity="0.5" />

        <!-- Agujeros, lejos de la cara para que no se confundan -->
        <circle cx="26" cy="63" r="3.5" fill="#0B0709" opacity="0.85" />
        <circle cx="37" cy="55" r="2.4" fill="#0B0709" opacity="0.85" />
        <circle cx="64" cy="63" r="2" fill="#0B0709" opacity="0.85" />

        <!-- Carita, en la parte ancha de la cuña -->
        <g>
          <circle cx="50" cy="49" r="2.2" fill="#0B0709" />
          <circle cx="60" cy="49" r="2.2" fill="#0B0709" />
          <circle cx="50.7" cy="48.2" r="0.7" fill="#FFF6E0" />
          <circle cx="60.7" cy="48.2" r="0.7" fill="#FFF6E0" />
          <path
            d="M49.5 55.5c1.8 2.4 4.2 3 6.6 1.6"
            stroke="#0B0709"
            stroke-width="1.8"
            stroke-linecap="round"
            fill="none"
          />
          <circle cx="44" cy="54" r="2.6" fill="#E07A5F" opacity="0.35" />
          <circle cx="65" cy="54" r="2.6" fill="#E07A5F" opacity="0.35" />
        </g>

        <!-- Manita, apoyada en el canto derecho -->
        <g class="mano">
          <path
            d="M68 45.5c3.4-2 7.2-1.8 9.6.5 2.5 2.3 2.5 5.6.3 7.7-2.2 2-5.6 1.9-8.4-.4"
            fill="url(#cargaOro)"
          />
          <path
            d="M70.5 42.5 69 36.8M75.5 43.2l2.2-5.6M65.8 43.6l-2.3-5.2"
            stroke="url(#cargaOro)"
            stroke-width="2.4"
            stroke-linecap="round"
          />
        </g>

        <!-- Destellos -->
        <path class="chispa" d="M24 30c.2 2.4 1 3.9 2.4 4.7-1.4.8-2.2 2.3-2.4 4.7-.2-2.4-1-3.9-2.4-4.7 1.4-.8 2.2-2.3 2.4-4.7Z" fill="#F6E3B8" />
        <path class="chispa" d="M62 22c.15 1.7.7 2.8 1.7 3.3-1 .6-1.55 1.6-1.7 3.3-.15-1.7-.7-2.8-1.7-3.3 1-.5 1.55-1.6 1.7-3.3Z" fill="#F6E3B8" />
      </svg>
      <p>Todo a su tiempo</p>
    </div>
