  <rect width="96" height="96" rx="22" fill="#0B0709"/>
  <circle cx="48" cy="48" r="46" fill="url(#rubor)"/>

  <!-- Anillo doble: exterior fino, interior filo -->
  <circle cx="48" cy="48" r="43" fill="none" stroke="url(#oro)" stroke-width="1.1" opacity="0.55"/>
  <path d="M62.5 8.6a41 41 0 1 1-29 0" fill="none" stroke="url(#oro)" stroke-width="2.6" stroke-linecap="round"/>

  <!-- Cuña de queso, con canto lateral para darle volumen -->
